name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 普通构建只读；部署权限仅授予 deploy job。
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # 个人站点为 /；项目站点自动识别 /仓库名/，无需手改源码。
      - name: Detect Pages base path
        id: base
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          if [[ "$REPOSITORY_NAME" == *.github.io ]]; then
            echo "value=/" >> "$GITHUB_OUTPUT"
          else
            echo "value=/$REPOSITORY_NAME/" >> "$GITHUB_OUTPUT"
          fi
      - name: Build static website
        run: npm run build
        env:
          SITE_BASE: ${{ steps.base.outputs.value }}
      - run: npm run check
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
